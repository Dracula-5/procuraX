name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, types, migrations, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: procurax
          POSTGRES_PASSWORD: procurax_dev
          POSTGRES_DB: procurax_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U procurax -d procurax_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PROCURAX_ENV: test
      PROCURAX_DATABASE_URL: postgresql+asyncpg://procurax_app:procurax_app_dev@127.0.0.1:5432/procurax_test
      PROCURAX_DATABASE_ADMIN_URL: postgresql+asyncpg://procurax:procurax_dev@127.0.0.1:5432/procurax_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint & format
        run: |
          uv run ruff check app tests alembic
          uv run ruff format --check app tests alembic
      - name: Type check
        run: uv run mypy app
      - name: Create least-privilege runtime role
        run: |
          PGPASSWORD=procurax_dev psql -h 127.0.0.1 -U procurax -d procurax_test -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE procurax_app LOGIN PASSWORD 'procurax_app_dev' NOSUPERUSER NOBYPASSRLS; GRANT CONNECT ON DATABASE procurax_test TO procurax_app;"
      - name: Migrations apply, round-trip and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests (unit, API, tenant isolation, RLS) with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Generated docs (RBAC matrix, policy reference, OpenAPI) are up to date
        run: uv run python -m app.scripts.gen_docs --check
      - name: Dependency vulnerability audit
        run: uv export --frozen --no-dev --no-hashes -o requirements.txt && uvx pip-audit -r requirements.txt

  frontend:
    name: Frontend · types, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  image:
    name: API container image
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: procurax-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
