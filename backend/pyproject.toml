[project]
name = "procurax-api"
version = "0.1.0"
description = "ProcuraX — procurement & spend transformation platform (API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pillow>=12.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["B008", "S101"]

[tool.ruff.lint.pycodestyle]
# Formatter wraps code at 110; long string literals (rule texts, messages) may run to 120.
max-line-length = 120

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's asyncio layer runs on greenlets; without this, lines resumed after an
# await on the database are under-reported.
concurrency = ["greenlet", "thread"]
omit = ["app/scripts/*"]
