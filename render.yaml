# Free-tier API blueprint (Render free web service). Database: Neon free. Web app: Netlify (netlify.toml).
# Step-by-step guide: docs/deployment.md. Values marked `sync: false` are entered in the Render
# dashboard when the blueprint is created, because they depend on your Neon database and on the
# exact *.onrender.com hostnames Render assigns.

services:
  - type: web
    name: procurax-api
    runtime: docker
    plan: free
    region: singapore  # closest Render region to Japan; create the Neon database in Singapore too
    # No rootDir: Render's docs disagree on whether paths are then relative to it, so every path
    # below is written from the repository root, which is unambiguous.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ready
    # Deploys are triggered by .github/workflows/deploy.yml after migrations succeed.
    autoDeployTrigger: "off"
    envVars:
      - key: PROCURAX_ENV
        value: prod
      - key: PROCURAX_DEMO_MODE
        value: "true"
      - key: PROCURAX_PUBLIC_DEMO
        value: "true"
      - key: PROCURAX_JWT_SECRET
        generateValue: true
      - key: PROCURAX_DATABASE_URL  # runtime role procurax_app; Neon's connection string can be pasted as-is
        sync: false
      - key: PROCURAX_PUBLIC_APP_URL  # the Netlify site URL, e.g. https://procurax.netlify.app (also the CORS origin)
        sync: false
      - key: PROCURAX_SLA_ESCALATION_INTERVAL_SECONDS
        value: "900"
      - key: PROCURAX_OCR_LANGUAGES
        value: eng+jpn
      - key: PROCURAX_DB_POOL_SIZE  # Neon free allows a limited number of connections
        value: "3"
      - key: PROCURAX_DB_MAX_OVERFLOW
        value: "2"
