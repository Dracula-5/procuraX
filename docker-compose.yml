# Local development infrastructure.
# pgvector image = stock PostgreSQL 16 + a vector extension reserved for future semantic
# retrieval; the current P13 policy-retrieval baseline uses BM25 and does not use vectors.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: procurax-postgres
    environment:
      POSTGRES_USER: procurax
      POSTGRES_PASSWORD: procurax_dev
      POSTGRES_DB: procurax
    ports:
      - "55433:5432"
    volumes:
      - procurax_pg:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurax -d procurax"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local SMTP sink for notification e-mail (gap-closure Phase 2). Nothing leaves the machine.
  # Web UI: http://localhost:8025 · SMTP: localhost:1025 (PROCURAX_SMTP_HOST/PORT defaults).
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: procurax-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  procurax_pg:
