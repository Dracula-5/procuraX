# Netlify (free) hosts the React SPA; the API runs on Render and is proxied under /api. See
# docs/deployment.md.

[build]
  base = "frontend"          # all paths below are relative to this directory
  command = "npm run build"  # Netlify installs dependencies from package-lock.json first
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # The SPA calls /api/v1 on its own site and Netlify forwards it to the API on Render (next rule). For
  # the browser there is then one site: the sign-in cookie is first-party (SameSite=Strict, not blocked as
  # a third-party cookie) and no CORS preflight is needed. See docs/security.md.
  VITE_API_BASE_URL = "/api/v1"

# Proxy the API through this site. Change the Render address here if the API moves.
[[redirects]]
  from = "/api/*"
  to = "https://procurax-mod8.onrender.com/api/:splat"
  status = 200
  force = true

# Client-side routes (/app, /purchase-to-pay, ...) all serve the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The browser talks to this site only (the API is proxied above).
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
