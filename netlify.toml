# Netlify (free) hosts the React SPA; the API runs on Render. See docs/deployment.md.
# VITE_API_BASE_URL is the public Render API address (not a secret). It is compiled into the
# bundle at build time; change it here if the API moves, and Netlify rebuilds on push.

[build]
  base = "frontend"          # all paths below are relative to this directory
  command = "npm run build"  # Netlify installs dependencies from package-lock.json first
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "https://procurax-mod8.onrender.com/api/v1"

# Client-side routes (/app, /purchase-to-pay, ...) all serve the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The browser may call only this site and the ProcuraX API on Render.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://procurax-mod8.onrender.com; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
