# Local Prometheus for the observability profile (docker compose --profile observability up).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: procurax-api
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials: local-metrics-token-change-me
    static_configs:
      - targets: ["api:8000"]
  - job_name: procurax-worker
    static_configs:
      - targets: ["worker:9101"]
